name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # deploys on every push to main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Lists all .xlsx files in the repo so the dashboard loads every import file.
      - name: Build import file manifest
        run: node scripts/build-import-manifest.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # uploads the whole repo root

      - id: deployment
        uses: actions/deploy-pages@v4
